name: PR Auto Title & Branch

on:
  pull_request:
    types: [opened, reopened]
  issue_comment:
    types: [created]

jobs:
  process-pr:
    if: |
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request != '' &&
       contains(github.event.comment.body, '@bot-s-m-quadri status'))
    runs-on: ubuntu-latest

    steps:
      - name: Get PR context
        id: pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BOT_TOKEN }}
          script: |
            let pr;
            if (context.eventName === 'pull_request') {
              pr = context.payload.pull_request;
            } else {
              const prNumber = context.payload.issue.number;
              const { data } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              pr = data;
            }
            return {
              number: pr.number,
              base: pr.base.ref,
              head: pr.head.ref,
              title: pr.title
            };

      - name: Extract PRN & Lab Number
        id: extract
        run: |
          BASE_BRANCH="${{ fromJson(steps.pr.outputs.result).base }}"
          HEAD_BRANCH="${{ fromJson(steps.pr.outputs.result).head }}"
          PR_TITLE="${{ fromJson(steps.pr.outputs.result).title }}"

          PRN=$(echo "$HEAD_BRANCH" | grep -oP 'BT[0-9A-Z]+' || true)
          if [ -z "$PRN" ]; then
            PRN=$(echo "$PR_TITLE" | grep -oP 'BT[0-9A-Z]+' || true)
          fi
          if [ -z "$PRN" ]; then
            gh api repos/${{ github.repository }}/issues/${{ fromJson(steps.pr.outputs.result).number }}/comments \
              -f body="❌ Could not extract PRN from branch or title."
            exit 1
          fi
          PRN=$(echo "$PRN" | tr '[:lower:]' '[:upper:]')

          LAB_NUM=$(echo "$BASE_BRANCH" | grep -oP '\d{2}$' || true)
          if [ -z "$LAB_NUM" ]; then
            LAB_NUM="00"
          fi

          echo "PRN=$PRN" >> $GITHUB_ENV
          echo "LAB_NUM=$LAB_NUM" >> $GITHUB_ENV
          echo "BASE_BRANCH=$BASE_BRANCH" >> $GITHUB_ENV

        env:
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}

      - name: Update PR title
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BOT_TOKEN }}
          script: |
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ fromJson(steps.pr.outputs.result).number }},
              title: `Submission of Lab ${process.env.LAB_NUM} by ${process.env.PRN}`
            });

      - name: Create label if not exists
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BOT_TOKEN }}
          script: |
            const labelName = `Lab ${process.env.LAB_NUM}`;
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: labelName
              });
            } catch {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: labelName,
                color: '0E8A16',
                description: `All submissions for Lab ${process.env.LAB_NUM}`
              });
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ fromJson(steps.pr.outputs.result).number }},
              labels: [labelName]
            });

      - name: Ensure sub-branch exists
        run: |
          TARGET_BRANCH="sub-lab-daa-${LAB_NUM}"
          git init temprepo
          cd temprepo
          git remote add origin "https://x-access-token:${{ secrets.BOT_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch origin
          if ! git rev-parse --verify origin/$TARGET_BRANCH >/dev/null 2>&1; then
            echo "Creating $TARGET_BRANCH from ${BASE_BRANCH}"
            git checkout -b "$TARGET_BRANCH" "origin/${BASE_BRANCH}"
            git push origin "$TARGET_BRANCH"
          else
            echo "$TARGET_BRANCH already exists"
          fi
        env:
          LAB_NUM: ${{ env.LAB_NUM }}
          BASE_BRANCH: ${{ env.BASE_BRANCH }}
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}

      - name: Change PR base branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BOT_TOKEN }}
          script: |
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ fromJson(steps.pr.outputs.result).number }},
              base: `sub-lab-daa-${process.env.LAB_NUM}`
            });

      - name: List all PRs for PRN
        id: listprs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BOT_TOKEN }}
          script: |
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "all",
              per_page: 100
            });
            const prn = process.env.PRN;
            const related = pulls.filter(p => p.title.includes(prn));
            return related.map(p => `- [#${p.number}](${p.html_url}) - ${p.title}`).join("\n");

      - name: Post beautiful status comment
        run: |
          REVIEW_DATE=$(date -d "+3 weeks" +"%d %B %Y")
          BODY=$(cat <<EOF
          ## 📌 PRN: $PRN

          We've successfully received your submission for **Lab ${LAB_NUM}**.

          **Your PRN**: \`$PRN\`  
          **Lab Number**: ${LAB_NUM}  
          **Base Branch**: \`${BASE_BRANCH}\`

          ### 📂 All your submissions so far:
          ${{ steps.listprs.outputs.result }}

          Please ensure you complete all required files for this lab.  
          We will review your submissions **within at most 3 weeks**, i.e., by **$REVIEW_DATE**.

          If you have doubts or questions, comment here, and we’ll get back to you  
          once you’ve completed your work.

          _Thank you for your submission._
          EOF
          )
          gh api repos/${{ github.repository }}/issues/${{ fromJson(steps.pr.outputs.result).number }}/comments \
            -f body="$BODY"
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}
          PRN: ${{ env.PRN }}
          LAB_NUM: ${{ env.LAB_NUM }}
          BASE_BRANCH: ${{ env.BASE_BRANCH }}
