name: Bot Merge & Organize

on:
  issue_comment:
    types: [created]

jobs:
  merge_and_organize:
    if: |
      github.event.issue.pull_request != '' &&
      contains(github.event.comment.body, '@bot-s-m-quadri merge') &&
      github.event.comment.user.login == 's-m-quadri'
    runs-on: ubuntu-latest

    steps:
      - name: Announce start
        run: |
          gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments \
            -f body="👋 **Hi!** Command received from @${{ github.event.comment.user.login }}.  
            I’ll start merging and organizing your submission now.  
            Please hold on while I complete my work!."
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}

      - name: Get PR details
        id: pr
        uses: octokit/request-action@v2.x
        with:
          route: GET /repos/{owner}/{repo}/pulls/{pull_number}
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          pull_number: ${{ github.event.issue.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}

      - name: Merge PR
        id: merge
        uses: octokit/request-action@v2.x
        with:
          route: PUT /repos/{owner}/{repo}/pulls/{pull_number}/merge
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          pull_number: ${{ github.event.issue.number }}
          merge_method: merge
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}
        continue-on-error: true

      - name: Check merge status
        run: |
          if [ "${{ steps.merge.outputs.status }}" != "200" ]; then
            gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments \
              -f body="❌ **Merge failed!**  
              I couldn’t merge this PR automatically.  
              Please check for conflicts or permissions and try again."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}

      - name: Checkout merged branch
        uses: actions/checkout@v3
        with:
          ref: ${{ fromJson(steps.pr.outputs.data).base.ref }}
          token: ${{ secrets.BOT_TOKEN }}
          fetch-depth: 0

      - name: Extract PRN
        run: |
          PR_TITLE="${{ fromJson(steps.pr.outputs.data).title }}"
          ROLL=$(echo "$PR_TITLE" | grep -oP 'BT[0-9A-Z]+' || true)
          if [ -z "$ROLL" ]; then
            gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments \
              -f body="⚠️ Could not extract PRN from PR title: **${PR_TITLE}**.  
              Please ensure the PR title contains a valid roll number."
            exit 1
          fi
          echo "ROLL=$ROLL" >> $GITHUB_ENV
          echo "BASE_BRANCH=${{ fromJson(steps.pr.outputs.data).base.ref }}" >> $GITHUB_ENV
          echo "HEAD_BRANCH=${{ fromJson(steps.pr.outputs.data).head.ref }}" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}

      - name: Determine Lab Folder
        run: |
          LAB_BASE="labs-design-analysis-algorithms"
          LAB_NUM=$(echo "${BASE_BRANCH}" | grep -oP '\d{2}$' || true)
          if [ -z "$LAB_NUM" ]; then
            LAB_NUM="00"
          fi
          LAB_DIR="$LAB_BASE/lab-$LAB_NUM"
          echo "LAB_DIR=$LAB_DIR" >> $GITHUB_ENV

      - name: Move files into PRN folder
        run: |
          mkdir -p "$LAB_DIR/$ROLL"
          shopt -s nullglob
          mv ./*.py "$LAB_DIR/$ROLL"/ || true
          mv ./*.ipynb "$LAB_DIR/$ROLL"/ || true
          mv ./*.csv "$LAB_DIR/$ROLL"/ || true
          mv ./*.md "$LAB_DIR/$ROLL"/ || true

      - name: Restore lab working set
        run: |
          ORIGINAL_BRANCH=$(echo "${BASE_BRANCH}" | sed 's/^sub-//')
          git checkout "origin/${ORIGINAL_BRANCH}" -- .

      - name: Commit changes as bot
        run: |
          git config user.name "bot-s-m-quadri"
          git config user.email "access.smq@gmail.com"
          git add "$LAB_DIR/$ROLL"
          git commit -m "Organize submission for $ROLL (merge into ${BASE_BRANCH})" || echo "No changes to commit"
          git push origin "${BASE_BRANCH}"

      - name: Announce success
        run: |
          gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments \
            -f body="✅ **All done!**  
            The PR was successfully merged into \`${BASE_BRANCH}\` and files were organized for **$ROLL**.  
            Everything is neat and tidy now!"
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
