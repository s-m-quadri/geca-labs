name: Lab Submission Status (on comment)

on:
  issue_comment:
    types: [created]

jobs:
  status-report:
    if: |
      github.event.issue.pull_request != '' &&
      contains(github.event.comment.body, '@bot-s-m-quadri status')
    runs-on: ubuntu-latest
    steps:
      # Get PR details
      - name: Get PR details
        id: pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BOT_TOKEN }}
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.payload.repository.owner.login,
              repo: context.payload.repository.name,
              pull_number: context.payload.issue.number
            });
            core.setOutput("title", pr.data.title);
            core.setOutput("base_ref", pr.data.base.ref);
            core.setOutput("head_ref", pr.data.head.ref);
            core.setOutput("changed_files", pr.data.changed_files);
            core.setOutput("mergeable_state", pr.data.mergeable_state);

      # Checkout PR branch
      - name: Checkout PR branch
        uses: actions/checkout@v3
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          token: ${{ secrets.BOT_TOKEN }}
          fetch-depth: 0

      # Extract Roll Number and Lab Directory
      - name: Extract Roll Number and Lab Directory
        run: |
          PR_TITLE="${{ steps.pr.outputs.title }}"
          BASE_BRANCH="${{ steps.pr.outputs.base_ref }}"

          ROLL=$(echo "$PR_TITLE" | grep -oP '(?<=by )BT[0-9A-Z]+' || true)
          if [ -z "$ROLL" ]; then
            echo "❌ Could not extract roll number from PR title: $PR_TITLE"
            exit 1
          fi
          echo "ROLL=$ROLL" >> $GITHUB_ENV

          case "$BASE_BRANCH" in
            lab-daa*) LAB_DIR="labs-design-analysis-algorithms" ;;
            lab-acn*) LAB_DIR="labs-adv-computer-netowrks" ;;
            lab-ml*)  LAB_DIR="labs-adv-machine-learning" ;;
            lab-cv*)  LAB_DIR="labs-computer-vision" ;;
            *) echo "❌ Unknown lab for branch $BASE_BRANCH"; exit 1 ;;
          esac
          echo "LAB_DIR=$LAB_DIR" >> $GITHUB_ENV

      # Generate status report
      - name: Generate report
        run: |
          echo "## 📊 Lab Submission Status" > comment.md
          echo "" >> comment.md
          echo "**Target Lab Folder:** \`$LAB_DIR\`" >> comment.md
          echo "**New Student Folder:** \`$ROLL\`" >> comment.md
          echo "" >> comment.md
          echo "### 📂 Files in Submission" >> comment.md
          if [ -d "$LAB_DIR/$ROLL" ]; then
            # List files in flat format
            find "$LAB_DIR/$ROLL" -type f -printf "- %P\n" >> comment.md
          else
            # List current files in working dir that would go into target
            find . -maxdepth 1 -type f -printf "- %P\n" >> comment.md
          fi
          echo "" >> comment.md
          echo "**Merge Conflict:** \`$( [ '${{ steps.pr.outputs.mergeable_state }}' = 'dirty' ] && echo 'yes' || echo 'no' )\`" >> comment.md
          echo "**Files Changed in PR:** \`${{ steps.pr.outputs.changed_files }}\`" >> comment.md
          echo "" >> comment.md
          echo "> 📝 This report only reflects the PR's current state and does not modify files." >> comment.md

      # Post comment
      - name: Post status comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BOT_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment.md', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.payload.issue.number,
              owner: context.payload.repository.owner.login,
              repo: context.payload.repository.name,
              body: body
            });
