name: Organize Lab Submission (on comment)

on:
  issue_comment:
    types: [created]

jobs:
  organize:
    if: |
      github.event.issue.pull_request != '' &&
      contains(github.event.comment.body, '@bot-s-m-quadri organize')
    runs-on: ubuntu-latest
    steps:
      - name: Get PR details
        uses: actions-ecosystem/action-get-merged-pull-request@v1
        with:
          github_token: ${{ secrets.BOT_TOKEN }}  # Use bot token here

      - name: Checkout PR branch
        uses: actions/checkout@v3
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          token: ${{ secrets.BOT_TOKEN }}  # Checkout with bot identity
          fetch-depth: 0

      - name: Get PR title
        id: prdata
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BOT_TOKEN }}
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.payload.repository.owner.login,
              repo: context.payload.repository.name,
              pull_number: context.payload.issue.number
            });
            core.setOutput("title", pr.data.title);
      
      - name: Extract Roll Number from PR title
        run: |
          PR_TITLE="${{ steps.prdata.outputs.title }}"
          ROLL=$(echo "$PR_TITLE" | grep -oP '(?<=by )BT[0-9A-Z]+' || true)
          if [ -z "$ROLL" ]; then
            echo "❌ Could not extract roll number from PR title: $PR_TITLE"
            exit 1
          fi
          echo "ROLL=$ROLL" >> $GITHUB_ENV


      # - name: Extract Roll Number from PR title
      #   run: |
      #     PR_TITLE="${{ steps.pr.outputs.title }}"
      #     ROLL=$(echo "$PR_TITLE" | grep -oP '(?<=by )BT[0-9A-Z]+')
      #     echo "ROLL=$ROLL" >> $GITHUB_ENV

      - name: Organize files (preview only)
        run: |
          mkdir -p "$ROLL"
          shopt -s nullglob
          mv ./*.py "$ROLL"/ || true
          echo "## Organized Files Preview" >> comment.md
          tree -L 2 >> comment.md

      - name: Post comment as bot-s-m-quadri
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BOT_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.name,
              body
            });
