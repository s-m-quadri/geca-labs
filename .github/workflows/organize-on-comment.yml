name: Lab Submission Status with Preview (on comment)

on:
  issue_comment:
    types: [created]

jobs:
  status-report:
    if: |
      github.event.issue.pull_request != '' &&
      contains(github.event.comment.body, '@bot-s-m-quadri status')
    runs-on: ubuntu-latest
    steps:
      # Get PR details
      - name: Get PR details
        id: pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BOT_TOKEN }}
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.payload.repository.owner.login,
              repo: context.payload.repository.name,
              pull_number: context.payload.issue.number
            });
            core.setOutput("title", pr.data.title);
            core.setOutput("base_ref", pr.data.base.ref);
            core.setOutput("head_ref", pr.data.head.ref);
            core.setOutput("changed_files", pr.data.changed_files);
            core.setOutput("mergeable_state", pr.data.mergeable_state);

      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.BOT_TOKEN }}
          fetch-depth: 0

      # Switch to sub-base branch
      - name: Switch to sub-base branch
        run: |
          BASE_BRANCH="${{ steps.pr.outputs.base_ref }}"
          SUB_BRANCH="sub-$BASE_BRANCH"
          git fetch origin

          if git ls-remote --exit-code --heads origin "$SUB_BRANCH"; then
            echo "✅ Found existing sub-branch $SUB_BRANCH. Checking out..."
            git checkout "$SUB_BRANCH"
          else
            echo "⚠️ Sub-branch $SUB_BRANCH not found. Creating from $BASE_BRANCH..."
            git checkout -B "$SUB_BRANCH" "origin/$BASE_BRANCH"
          fi

      # Merge PR branch locally (no push)
      - name: Merge PR branch locally
        run: |
          PR_BRANCH="${{ steps.pr.outputs.head_ref }}"
          git fetch origin "$PR_BRANCH"
          git merge --no-commit --no-ff "origin/$PR_BRANCH" || true

      # Extract Roll Number and Lab Directory
      - name: Extract Roll Number and Lab Directory
        run: |
          PR_TITLE="${{ steps.pr.outputs.title }}"
          BASE_BRANCH="${{ steps.pr.outputs.base_ref }}"

          ROLL=$(echo "$PR_TITLE" | grep -oP '(?<=by )BT[0-9A-Z]+' || true)
          if [ -z "$ROLL" ]; then
            echo "❌ Could not extract roll number from PR title: $PR_TITLE"
            exit 1
          fi
          echo "ROLL=$ROLL" >> $GITHUB_ENV

          case "$BASE_BRANCH" in
            lab-daa*) LAB_DIR="labs-design-analysis-algorithms" ;;
            lab-acn*) LAB_DIR="labs-adv-computer-netowrks" ;;
            lab-ml*)  LAB_DIR="labs-adv-machine-learning" ;;
            lab-cv*)  LAB_DIR="labs-computer-vision" ;;
            *) echo "❌ Unknown lab for branch $BASE_BRANCH"; exit 1 ;;
          esac
          echo "LAB_DIR=$LAB_DIR" >> $GITHUB_ENV

      # Move files locally into PRN folder (preview only)
      - name: Organize files into PRN folder (preview only)
        run: |
          mkdir -p "$LAB_DIR/$ROLL"
          shopt -s nullglob
          mv ./*.py "$LAB_DIR/$ROLL"/ || true
          mv ./*.ipynb "$LAB_DIR/$ROLL"/ || true
          mv ./*.csv "$LAB_DIR/$ROLL"/ || true
          echo "## 📊 Lab Submission Status (Preview)" > comment.md
          echo "" >> comment.md
          echo "**Target Lab Folder:** \`$LAB_DIR\`" >> comment.md
          echo "**PRN Folder:** \`$ROLL\`" >> comment.md
          echo "**Working Branch:** \`sub-${{ steps.pr.outputs.base_ref }}\`" >> comment.md
          echo "" >> comment.md
          echo "### 📂 Preview of Organized Files" >> comment.md
          tree -L 3 "$LAB_DIR/$ROLL" >> comment.md || echo "_No files found_" >> comment.md
          echo "" >> comment.md
          echo "**Merge Conflict:** \`$( [ '${{ steps.pr.outputs.mergeable_state }}' = 'dirty' ] && echo 'yes' || echo 'no' )\`" >> comment.md
          echo "**Files Changed in PR:** \`${{ steps.pr.outputs.changed_files }}\`" >> comment.md
          echo "" >> comment.md
          echo "> 📝 This is a preview only. No changes were pushed to remote." >> comment.md

      # Post comment
      - name: Post status comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BOT_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment.md', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.payload.issue.number,
              owner: context.payload.repository.owner.login,
              repo: context.payload.repository.name,
              body: body
            });
