name: Status and Corrections

on:
  issue_comment:
    types: [created]

jobs:
  process-pr:
    if: |
      github.event.issue.pull_request != '' &&
      contains(github.event.comment.body, 'Hi @bot-s-m-quadri') &&
      !contains(github.event.comment.body, 'merge')
    runs-on: ubuntu-latest
    steps:
      - name: Get PR context
        id: pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BOT_TOKEN }}
          script: |
            let pr;
            if (context.eventName === 'pull_request') {
              pr = context.payload.pull_request;
            } else {
              const prNumber = context.payload.issue.number;
              const { data } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              pr = data;
            }
            return {
              number: pr.number,
              base: pr.base.ref,
              head: pr.head.ref,
              title: pr.title,
              headRepo: pr.head.repo.full_name,
              baseRepo: pr.base.repo.full_name

            };

      - name: Ensure standard labels exist
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BOT_TOKEN }}
          script: |
            const labels = [
              { name: '🎉 Accepted', color: '28A745', description: 'Submission accepted and merged' },
              { name: '⚠️ Incomplete', color: 'FFA500', description: 'Submission incomplete or pending review' },
              { name: '⛌ Error! Must Provide PRN', color: 'D73A4A', description: 'PRN not found in branch or title' },
              { name: '😵 Conflict! Please Give Access to Resolve', color: 'B60205', description: 'Merge conflicts detected' },
              { name: '⛌ Error! Please Resubmit', color: 'D73A4A', description: 'Invalid base branch or other critical error' }
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name
                });
              } catch {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
              }
            }

      - name: Extract PRN & Lab Number
        id: extract
        run: |
          BASE_BRANCH="${{ fromJson(steps.pr.outputs.result).base }}"
          HEAD_BRANCH="${{ fromJson(steps.pr.outputs.result).head }}"
          PR_TITLE="${{ fromJson(steps.pr.outputs.result).title }}"
          PR_AUTHOR="${{ github.event.issue.user.login }}"

          # Fork PRs: head ref may be "fork-owner:branch-name" — normalize to branch only
          case "$HEAD_BRANCH" in
            *:*)
              HEAD_BRANCH="${HEAD_BRANCH#*:}"
              ;;
          esac

          PRN=$(echo "$HEAD_BRANCH" | grep -ioP 'BT[0-9A-Z]+' || true)
          if [ -z "$PRN" ]; then
            PRN=$(echo "$PR_TITLE" | grep -ioP 'BT[0-9A-Z]+' || true)
          fi
          if [ -z "$PRN" ]; then
            gh api repos/${{ github.repository }}/issues/${{ fromJson(steps.pr.outputs.result).number }}/comments \
              -f body="❌ Could not extract PRN from branch or title."
            # Add error label
            gh api repos/${{ github.repository }}/issues/${{ fromJson(steps.pr.outputs.result).number }}/labels \
              -f labels[]="⛌ Error! Must Provide PRN"
            exit 1
          fi
          PRN=$(echo "$PRN" | tr '[:lower:]' '[:upper:]')
          echo "PR_AUTHOR=$PR_AUTHOR" >> $GITHUB_ENV

          # Extract subject and lab number from branch (lab-{subject}-{NN} or lab-{subject})
          SUBJECT=$(echo "$HEAD_BRANCH" | grep -oP 'lab-\K[a-z]+' || true)
          if [ -z "$SUBJECT" ]; then
            gh api repos/${{ github.repository }}/issues/${{ fromJson(steps.pr.outputs.result).number }}/comments \
              -f body="❌ Could not extract subject from branch. Expected format: lab-{subject}-{NN} or lab-{subject}"
            exit 1
          fi

          # Strip version suffix (-v1, -v2, ...) before numeric extraction
          CLEAN_BRANCH=$(echo "$HEAD_BRANCH" | sed 's/-v[0-9]*$//')

          # Lab number after lab-{subject}- (supports lab-dbms-6 and lab-dbms-06)
          if [[ "$CLEAN_BRANCH" =~ ^lab-[a-z]+-([0-9]{1,2})$ ]]; then
            LAB_NUM=$(printf '%02d' "$((10#${BASH_REMATCH[1]}))")
          elif [[ "$CLEAN_BRANCH" =~ ^lab-[a-z]+$ ]]; then
            LAB_NUM="00"
          else
            LAB_NUM=$(echo "$CLEAN_BRANCH" | grep -oP '[0-9]{1,2}$' || true)
            if [ -n "$LAB_NUM" ]; then
              LAB_NUM=$(printf '%02d' "$((10#$LAB_NUM))")
            fi
          fi

          if [ -z "$LAB_NUM" ]; then
            gh api repos/${{ github.repository }}/issues/${{ fromJson(steps.pr.outputs.result).number }}/comments \
              -f body="❌ Could not extract Lab number from branch."
            exit 1
          fi

          echo "PRN=$PRN" >> $GITHUB_ENV
          echo "LAB_NUM=$LAB_NUM" >> $GITHUB_ENV
          echo "SUBJECT=$SUBJECT" >> $GITHUB_ENV
          echo "BASE_BRANCH=$BASE_BRANCH" >> $GITHUB_ENV

        env:
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}

      - name: Update PR title
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BOT_TOKEN }}
          script: |
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ fromJson(steps.pr.outputs.result).number }},
              title: `Submission of Lab ${process.env.LAB_NUM} by ${process.env.PRN}`
            });

      - name: Create and apply labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BOT_TOKEN }}
          script: |
            const labLabel = `Lab ${process.env.LAB_NUM}`;
            const incompleteLabel = '⚠️ Incomplete';

            // Create Lab label if not exists
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: labLabel
              });
            } catch {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: labLabel,
                color: '0E8A16',
                description: `All submissions for Lab ${process.env.LAB_NUM}`
              });
            }

            // Create Incomplete label if not exists
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: incompleteLabel
              });
            } catch {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: incompleteLabel,
                color: 'FFA500',
                description: 'Submission incomplete or pending review'
              });
            }

            // Apply labels
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ fromJson(steps.pr.outputs.result).number }},
              labels: [labLabel, incompleteLabel]
            });

      - name: Validate and ensure sub-branch
        run: |
          TARGET_BRANCH="sub-lab-${SUBJECT}-${LAB_NUM}"

          # Guardrail: Block if targeting stable directly
          if [[ "${BASE_BRANCH}" == "stable" ]]; then
            gh api repos/${{ github.repository }}/issues/${{ fromJson(steps.pr.outputs.result).number }}/comments \
              -f body="⛌ **Error!** Cannot target \`stable\` branch directly. Must target \`${TARGET_BRANCH}\`."
            gh api repos/${{ github.repository }}/issues/${{ fromJson(steps.pr.outputs.result).number }}/labels \
              -f labels[]="⛌ Error! Please Resubmit"
            exit 1
          fi

          git init temprepo
          cd temprepo
          git remote add origin "https://x-access-token:${{ secrets.BOT_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch origin
          if ! git rev-parse --verify origin/$TARGET_BRANCH >/dev/null 2>&1; then
            # Get the lab branch name (should be lab-{subject}-{NN})
            LAB_BRANCH="lab-${SUBJECT}-${LAB_NUM}"
            echo "Creating $TARGET_BRANCH from ${LAB_BRANCH}"
            git checkout -b "$TARGET_BRANCH" "origin/${LAB_BRANCH}"
            git push origin "$TARGET_BRANCH"
          else
            echo "$TARGET_BRANCH already exists"
          fi
        env:
          LAB_NUM: ${{ env.LAB_NUM }}
          SUBJECT: ${{ env.SUBJECT }}
          BASE_BRANCH: ${{ env.BASE_BRANCH }}
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}

      - name: Change PR base branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BOT_TOKEN }}
          script: |
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ fromJson(steps.pr.outputs.result).number }},
              base: `sub-lab-${process.env.SUBJECT}-${process.env.LAB_NUM}`
            });

      - name: List all PRs for user
        id: listprs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BOT_TOKEN }}
          script: |
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "all",
              per_page: 1000
            });
            const username = process.env.PR_AUTHOR;
            const related = pulls.filter(p => p.user.login === username);
            return related.map(p => `- #${p.number}`).join(`\n`);

      - name: Prepare PR list
        run: |
          {
            echo "PR_LIST<<EOF"
            echo -e ${{ steps.listprs.outputs.result }}
            echo "EOF"
          } >> $GITHUB_ENV

      - name: Post status comment
        run: |
          REVIEW_DATE=$(date -d "+1 week" +"%d %B %Y")
          NOW_IST=$(TZ="Asia/Kolkata" date +"%d %B %Y, %I:%M %p IST")

          BODY=$(cat <<EOF
          ### PRN: <a href="https://github.com/s-m-quadri/geca-labs/pulls?q=$PRN" target="_blank"><code>$PRN</code></a> Status

          Please complete the current lab before the review date.

          > [!NOTE]
          > - Submission Date: **$NOW_IST**  
          > - Next Review: **$REVIEW_DATE**  
          >
          > | Info. | Value/Link |
          > |-----------------:|:------|
          > | PRN              | <a href="https://github.com/s-m-quadri/geca-labs/pulls?q=$PRN" target="_blank"><b>$PRN</b></a> (Click to search all PR) |
          > | Lab Number       | <a href="https://www.s-m-quadri.me/geca/${SUBJECT}/${LAB_NUM}" target="_blank"><b>${LAB_NUM}</b></a> (Click to open manual pages) |
          > | Base Repository  | <a href="https://github.com/s-m-quadri/geca-labs" target="_blank"><b>geca-labs</b></a> (Click to open repository) |
          > | Base Branch      | <a href="https://github.com/${{ github.repository }}/tree/${{ fromJson(steps.pr.outputs.result).base }}" target="_blank"><b>${{ fromJson(steps.pr.outputs.result).base }}</b></a> (Click to view problem set) |
          > | Student's (Merge) Repository | <a href="https://github.com/${{ fromJson(steps.pr.outputs.result).headRepo }}" target="_blank"><b>${{ fromJson(steps.pr.outputs.result).headRepo }}</b></a> (Click to view student fork) |
          > | Student's (Merge) Branch     | <a href="https://github.com/${{ fromJson(steps.pr.outputs.result).headRepo }}/tree/${{ fromJson(steps.pr.outputs.result).head }}" target="_blank"><b>${{ fromJson(steps.pr.outputs.result).head }}</b></a> (Click to <b>resume</b> your work) |

          ### All Submissions
          $PR_LIST

          In case of doubts, contact 📧 **hi@s-m-quadri.me**, or <a href="https://github.com/${{ github.repository }}/pull/${{ fromJson(steps.pr.outputs.result).number }}" target="_blank"><b>comment here</b></a>.

          Thanks for your initiation of PR! 🙂 Keep it up!
          EOF
          )
          gh api repos/${{ github.repository }}/issues/${{ fromJson(steps.pr.outputs.result).number }}/comments \
            -f body="$BODY"
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}
          PRN: ${{ env.PRN }}
          LAB_NUM: ${{ env.LAB_NUM }}
          SUBJECT: ${{ env.SUBJECT }}
          BASE_BRANCH: ${{ env.BASE_BRANCH }}
